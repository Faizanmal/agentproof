[project]
name = "agentproof-broker"
version = "0.1.0"
description = "Private sandbox broker; sole owner of disposable runner lifecycle"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3"]

[project.scripts]
agentproof-broker = "agentproof_broker.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof_broker"]
