[project]
name = "agentproof-api"
version = "0.1.0"
description = "AgentProof API and domain services"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3",
  "uvicorn>=0.34,<1", "SQLAlchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1", "alembic>=1.16,<2", "redis>=5.3,<6",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof_api"]
