[project]
name = "agentproof-runner"
version = "0.1.0"
description = "Broker-only runner scaffold; browser execution is disabled"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["playwright>=1.53,<2", "pydantic>=2.11,<3"]

[project.scripts]
agentproof-runner = "agentproof_runner.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof_runner"]
