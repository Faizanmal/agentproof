[project]
name = "agentproof-runner"
version = "0.1.0"
description = "Minimal Playwright executor for disposable broker-owned sandboxes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["playwright==1.64.1", "pydantic>=2.11,<3"]

[project.scripts]
agentproof-runner = "agentproof_runner.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof_runner"]
