# Manually gated image publish only. Does not provision Vultr VMs or deploy on push.
# Requires a protected GitHub Environment named production plus registry secrets.
name: Publish production images
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable tag suffix (git SHA or semver). Digests are recorded after push.
        required: true
        type: string
      confirm:
        description: Type PUBLISH to confirm a deliberate release build.
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Require private registry configuration
        shell: bash
        run: |
          if [ -z "${{ secrets.PRODUCTION_REGISTRY }}" ]; then
            echo 'BLOCKED: set PRODUCTION_REGISTRY, PRODUCTION_REGISTRY_USERNAME, and PRODUCTION_REGISTRY_PASSWORD in the production environment.'
            exit 1
          fi
      - name: Log in to private registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ secrets.PRODUCTION_REGISTRY }}
          username: ${{ secrets.PRODUCTION_REGISTRY_USERNAME }}
          password: ${{ secrets.PRODUCTION_REGISTRY_PASSWORD }}
      - name: Build and push immutable tags
        shell: bash
        env:
          REGISTRY: ${{ secrets.PRODUCTION_REGISTRY }}
          TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          {
            echo '## Published digests'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in web:apps/web/Dockerfile api:apps/api/Dockerfile worker:apps/worker/Dockerfile runner:apps/runner/Dockerfile; do
            name="${pair%%:*}"
            file="${pair##*:}"
            image="${REGISTRY}/agentproof-${name}:${TAG}"
            if [[ "$name" == "runner" ]]; then
              docker build --target runtime -f "$file" -t "$image" .
            else
              docker build -f "$file" -t "$image" .
            fi
            docker push "$image"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
            echo "- ${name}: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
