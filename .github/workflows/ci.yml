name: Local foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.3
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: .cache/pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: python scripts/manage.py bootstrap
      - run: python scripts/manage.py lint
      - run: python scripts/manage.py typecheck
      - run: python scripts/manage.py test
      - run: python scripts/manage.py security
      - run: python scripts/manage.py build
      - name: Generated contracts are current
        run: |
          python scripts/manage.py contracts
          git diff --exit-code -- packages/contracts
      - run: docker compose -f infra/compose.dev.yml config --quiet
      - run: python scripts/manage.py db-up
      - run: python scripts/manage.py migrate
      - name: HTTP runtime smoke
        run: |
          uv run --frozen --all-packages uvicorn agentproof_api.app:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log > /tmp/agentproof-api.log 2>&1 &
          API_PID=$!
          pnpm --filter web start --hostname 127.0.0.1 > /tmp/agentproof-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready && curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/manage.py smoke
          docker compose -f infra/compose.dev.yml stop redis
          uv run --frozen --all-packages python scripts/smoke.py --expect-not-ready
          docker compose -f infra/compose.dev.yml up -d --wait redis
          python scripts/manage.py smoke
      - name: Stop local services
        if: always()
        run: docker compose -f infra/compose.dev.yml down
